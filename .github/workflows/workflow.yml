on:
  push:
    branches:
      - mlucas/ogc
jobs:
  build_app_pack:
    environment: DIT
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v4

      - name: Use OGC App Pack Generator Action
        uses: MAAP-Project/ogc-app-pack-generator@feature/create-action
        with:
          # Specify action inputs
          algorithm-configuration-path: nasa/algorithm_config.yml
          dockerfile-path: esa/Dockerfile